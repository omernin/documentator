[project]
name = "documentator"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "omern", email = "omer.nin@gmail.com" }
]
dependencies = [
    "requests>=2.32.3",
    "beautifulsoup4>=4.13.3",
    "openai>=1.73.0",
    "python-dotenv>=1.1.0",
    "lxml[html_clean]>=5.3.2",
    "readability-lxml>=0.8.1",
    "tqdm>=4.67.1",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/documentator"]

[project.scripts]
documentator = "documentator.main:cli_entry_point"
